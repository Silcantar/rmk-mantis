[keyboard]
name = "rmk-mantis"
product_name = "rmk-mantis"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "RMK"
# chip = "nrf52840"
board = "nice!nano_v2"

[matrix]
row_pins = [
    "P0_06", # D1
    "P0_08", # D0
    "P0_17", # D2
    "P0_20", # D3
]
col_pins = [
    "P0_02", # D19
    "P1_15", # D18
    "P1_13", # D15
    "P1_11", # D14
    "P0_10", # D16
    "P1_04", # D8
    "P0_11", # D7
    "P1_00", # D6
    "P0_24", # D5
    "P0_22", # D4
]
bootmagic = [3, 9]
unlock_keys = [[3, 9], [3, 0]]

[layout]
rows = 4
cols = 10
map = """
    (3, 9)      (0, 9)      (0, 8)      (0, 7)      [2]                     (0, 2)      (0, 1)      (0, 0)      (3, 0)
[0.5]   (1, 9)      (1, 8)      (1, 7)      (0, 6)  [1]             (0, 3)      (1, 2)      (1, 1)      (1, 0)
    (2, 9)      (2, 8)      (2, 7)      (1, 6)      (0, 5)      (0, 4)      (1, 3)      (2, 2)      (2, 1)      (2, 0)
[1.5]               (3, 8)      (2, 6)      (1, 5)  [1]             (1, 4)      (2, 3)      (3, 1)
[2]                         (3, 6)      (3, 5)      (2, 5)      (2, 4)      (3, 4)      (3, 3)
[3.5]                                       (3, 7)  [1]             (3, 2)
"""

[ble]
enabled = true
# vddh has an internal voltage divider
# battery_adc_pin = "vddh"
# Or
# battery_adc_pin = "P0_04"
# adc_divider_measured = 2000
# adc_divider_total = 2806

# charge_state.pin = "P0_25"
# charge_state.low_active = false
# charge_led.pin = "P0_29"
# charge_led.low_active = false

[display]
driver = "ssd1306"
size = "128x64"
rotation = 180
renderer = "OledRenderer"

[keymap]
layers = 4

[[keymap.layer]]
name = "Colemak"
keys = """
    B           @fQuot      W           F                                   U           Y           @fUnds      J
        @A_LGui     @R_LAlt     @S_LCtl     P                       L           @E_RCtl     @I_LAlt     @O_RGui
    @X_Undo     @V_Cut      @C_Copy     @T_LSft     @G_RAlt     @M_RAlt     @N_RSft     K           Comma       Dot
                    @Esc_LC     @D_Pste     @Q_Undo                 Z           H           Del
                            @Ent_LSft   @Spc_F22 Tab            Compose     Bspc        OSM(LSft)
                                            @tdNum                  @tdNav
"""

[[keymap.layer]]
name = "Numeric"
keys = """
    Eql         @fLT        @fBrc       @fCbr                               @fExcl      @fAmp       Mins        @fGT
        7           5           3           @fPrn                   @fQues      2           4           6
    Grv         @fHash      @fAst       1       @Bsls_Ralt      Slsh        0           @fPlus      ____        ____
                    ____        9           @fPct                   @fDlr       8           ____
                            ____        ____        ____        ____        ____        ____
                                            ____                    ____
"""

[[keymap.layer]]
name = "Navigation"
keys = """
    PScr        Caps        @CapsWord   Home                                F4          F7          F10         App
        Left        Down        Up          End                     F1          @F5_RCtl    @F8_LAlt    @F11_RGui
    @Undo_LGui  @Cut_LAlt   @Copy_LCtl  Right       TO(Game)    @PgUp_RAlt  @F2_RSft    F6          F9          F12
                    ____        @Pste_LSft  @Redo_RAlt              PgDn        F3          ____
                            ____        ____        ____        ____        ____        ____
                                            ____                    ____
"""

[[keymap.layer]]
name = "Game"
keys = """
    E           1           2           3                                   F16         F19        F22          Bootloader
        A           S           W           4                       F13         F17         F20           F23
    6           7           8           D           5           BT_Nxt      F14         F18         F21         F24
                    ____        9           R                       BT_Clr      F15         ____
                            LSft        Spc         Tab         ____        TO(0)       ____
                                            LCtl                    ____
"""

[aliases]
CapsWord = "CapsWordToggle"

# ---- Shifted Keys ----
Excl = "SHIFTED(1)"
At = "SHIFTED(2)"
Hash = "SHIFTED(3)"
Dlr = "SHIFTED(4)"
Pct = "SHIFTED(5)"
Crt = "SHIFTED(6)"
Amp = "SHIFTED(7)"
Ast = "SHIFTED(8)"
LPrn = "SHIFTED(9)"
RPrn = "SHIFTED(0)"
Unds = "SHIFTED(Mins)"
Plus = "SHIFTED(Eql)"
Tild = "SHIFTED(Grv)"
LCbr = "SHIFTED(LBrc)"
RCbr = "SHIFTED(RBrc)"
Pipe = "SHIFTED(Bsls)"
Cln = "SHIFTED(Scln)"
DQuo = "SHIFTED(Quot)"
LT = "SHIFTED(Comm)"
GT = "SHIFTED(Dot)"
Ques = "SHIFTED(Slsh)"

# ---- Shortcuts ----
Undo = "WM(Z, LCtl)"
Cut = "WM(X, LCtl)"
Copy = "WM(C, LCtl)"
Pste = "WM(V, LCtl)"
Redo = "WM(Y, LCtl)"

# ---- Tap / Holds ----
# Escape / Layer Clear
Esc_LC = "TH(Esc, TO(0))"

# Thumb Keys
Ent_LSft = "MT(Ent, LSft, T)"
Spc_F22 = "TH(Spc, F22, T)"

# Colemak Layer
A_LGui = "MT(A, LGui, P)"
R_LAlt = "MT(R, LAlt, R)"
S_LCtl = "MT(S, LCtl, M)"
T_LSft = "MT(T, LSft, I)"
G_RAlt = "MT(G, RAlt, N)"
M_RAlt = "MT(M, RAlt, N)"
N_RSft = "MT(N, RSft, I)"
E_RCtl = "MT(E, RCtl, M)"
I_LAlt = "MT(I, LAlt, R)"
O_RGui = "MT(O, RGui, P)"
X_Undo = "TH(X, @Undo, P)"
V_Cut = "TH(V, @Cut, R)"
C_Copy = "TH(C, @Copy, M)"
D_Pste = "TH(D, @Pste, I)"
Q_Redo = "TH(Q, @Redo, N)"

# Numeric Layer
7_LGui = "MT(7, LGui, P)"
5_LAlt = "MT(5, LAlt, R)"
3_LCtl = "MT(3, LCtl, M)"
1_LSft = "MT(1, LSft, I)"
Bsls_RAlt = "MT(Bsls, RAlt, N)"
Slsh_RAlt = "MT(Slsh, RAlt, N)"
0_RSft = "MT(0, RSft, I)"
2_RCtl = "MT(2, RCtl, M)"
4_LAlt = "MT(4, LAlt, R)"
6_RGui = "MT(6, RGui, P)"
Grv_Undo = "TH(Grv, @Undo, P)"
Hash_Cut = "TH(Hash, @Cut, R)"
Ast_Copy = "TH(Ast, @Copy, M)"
9_Pste = "TH(9, @Pste, I)"
Pct_Redo = "TH(Pct, @Redo, N)"

# Navigation Layer
Undo_LGui = "TH(@Undo, LGui)"
Cut_LAlt = "TH(@Cut, LAlt)"
Copy_LCtl = "TH(@Copy, LCtl)"
Pste_LSft = "TH(@Pste, LSft)"
Redo_RAlt = "TH(@Redo, RAlt)"
PgUp_RAlt = "TH(PgUp, RAlt)"
F2_RSft = "TH(F2, RSft)"
F5_RCtl = "TH(F5, RCtl)"
F8_LAlt = "TH(F8, LAlt)"
F11_RGui = "TH(F11, RGui)"

# ---- Forks ----
fQuot = "User11"
fUnds = "User12"
fLT = "User13"
fCbr = "User14"
fExcl = "User15"
fAmp = "User16"
fGT = "User17"
fPrn = "User18"
fQues = "User19"
fHash = "User20"
fAst = "User21"
fPlus = "User22"
fPct = "User23"
fDlr = "User24"

# ---- Tap Dances ----
tdNum = "TD(0)"
tdNav = "TD(1)"
tdQuot = "TD(2)"
tdDQuo = "TD(3)"
tdPar = "TD(4)"
tdBrc = "TD(5)"
tdCbr = "TD(6)"
tdAng = "TD(7)"

[behavior.fork]
forks = [
    # Colemak Layer
    # Quote / Double Quote
    { trigger = "@fQuot", negative_output = "@tdQuot", positive_output = "@tdDQuo", match_any = "LSft | RSft" },
    # Underscore / Hyphen
    { trigger = "@fUnds", negative_output = "@Unds", positive_output = "Mins", match_any = "LSft | RSft" },
    # Comma / Semicolon
    { trigger = "Comm", negative_output = "Comm", positive_output = "Scln", match_any = "LSft | RSft" },
    # Dot / Colon
    { trigger = "Dot", negative_output = "Dot", positive_output = "@Cln", match_any = "LSft | RSft" },
    # Numeric Layer
    # Less Than / Less Than or Equal
    { trigger = "@fLT", negative_output = "@tdAng", positive_output = "@LTE", match_any = "LSft | RSft" },
    # Left Bracket / Right Bracket
    { trigger = "LBrc", negative_output = "@tdBrc", positive_output = "RBrc", match_any = "LSft | RSft" },
    # Left Brace / Right Brace
    { trigger = "@fCbr", negative_output = "@tdCbr", positive_output = "@RCbr", match_any = "LSft | RSft" },
    # Exclamation / Inverted Exclamation
    { trigger = "@fExcl", negative_output = "@Excl", positive_output = "Macro(iexcl)", match_any = "LSft | RSft" },
    # Ampersand / Interrobang
    { trigger = "@fAmp", negative_output = "@Amp", positive_output = "Macro(intb)", match_any = "LSft | RSft" },
    # Greater Than / Greater than or Equal
    { trigger = "@fGT", negative_output = "@GT", positive_output = "@GTE", match_any = "LSft | RSft" },
    # 7 / Square Root
    { trigger = "7", negative_output = "MT(7, LGui)", positive_output = "MT(Macro(sqrt), LGui)", match_any = "LSft | RSft" },
    # 5 / Euro
    { trigger = "5", negative_output = "MT(5, LAlt)", positive_output = "MT(Macro(euro), LAlt)", match_any = "LSft | RSft" },
    # 3 / Micro
    { trigger = "3", negative_output = "MT(3, LCtl)", positive_output = "MT(Macro(micro), LCtl)", match_any = "LSft | RSft" },
    # Left Paren / Right Paren
    { trigger = "@fPrn", negative_output = "@tdPrn", positive_output = "@RPrn", match_any = "LSft | RSft" },
    # Question / Inverted Question
    { trigger = "@fQues", negative_output = "@tdQues", positive_output = "Macro(iques)", match_any = "LSft | RSft" },
    # 2 / Tilde
    { trigger = "2", negative_output = "MT(2, RCtl)", positive_output = "MT(@Tild, RCtl)", match_any = "LSft | RSft" },
    # 4 / Degree
    { trigger = "4", negative_output = "MT(4, LAlt)", positive_output = "MT(Macro(deg), LAlt)", match_any = "LSft | RSft" },
    # Grave / Acute
    { trigger = "Grv", negative_output = "TH(Grv, @Undo)", positive_output = "TH(Macro(acute), @Undo)", match_any = "LSft | RSft" },
    # Hash / UK Pound
    { trigger = "@fHash", negative_output = "TH(@Hash, @Cut)", positive_output = "TH(Macro(gbp), @Cut)", match_any = "LSft | RSft" },
    # Asterisk / Multiplication Sign
    { trigger = "@fAst", negative_output = "TH(@Ast, @Copy)", positive_output = "TH(Macro(mult), @Copy)", match_any = "LSft | RSft" },
    # 1 / N Dash
    { trigger = "1", negative_output = "MT(1, LSft)", positive_output = "MT(Macro(ndash), LSft)", match_any = "LSft | RSft" },
    # Slash / Division Sign
    { trigger = "Slsh", negative_output = "MT(Slsh, RAlt)", positive_output = "MT(Macro(div), RAlt)", match_any = "LSft | RSft" },
    # 0 / At Sign
    { trigger = "0", negative_output = "MT(0, RSft)", positive_output = "MT(@At, RSft)", match_any = "LSft | RSft" },
    # Plus / Plus or Minus
    { trigger = "@fPlus", negative_output = "@Plus", positive_output = "Macro(plmn)", match_any = "LSft | RSft" },
    # 9 / M Dash
    { trigger = "9", negative_output = "TH(9, @Pste)", positive_output = "TH(Macro(mdash), @Pste)", match_any = "LSft | RSft" },
    # Percent / Per mille
    { trigger = "@fPct", negative_output = "TH(@Pct, @Redo)", positive_output = "TH(Macro(perm), @Redo)", match_any = "LSft | RSft" },
    # Dollar / Cent
    { trigger = "@fDlr", negative_output = "@Dlr", positive_output = "Macro(cent)", match_any = "LSft | RSft" },
    # 8 / Infinity
    { trigger = "8", negative_output = "8", positive_output = "Macro(inf)", match_any = "LSft | RSft" },
]

