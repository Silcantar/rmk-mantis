# ---- Forks ----
# Colemak Layer

# 0: Quote / Double Quote
[[behavior.fork.forks]]
trigger = "User11"
negative_output = "TD(2)"
positive_output = "TD(3)"
match_any = "LShift | RShift"

# 1: Underscore / Hyphen
[[behavior.fork.forks]]
trigger = "User12"
negative_output = "Shifted(Mins)"
positive_output = "Mins"
match_any = "LShift | RShift"

# 2: Comma / Semicolon
[[behavior.fork.forks]]
trigger = "Comm"
negative_output = "Comm"
positive_output = "Scln"
match_any = "LShift | RShift"

# 3: Dot / Colon
[[behavior.fork.forks]]
trigger = "Dot"
negative_output = "Dot"
