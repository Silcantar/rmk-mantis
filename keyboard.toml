[keyboard]
name = "rmk-mantis"
product_name = "rmk-mantis"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "RMK"
# chip = "nrf52840"
board = "nice!nano_v2"

[rmk]
fork_max_num = 255
macro_space_size = 65535
morse_max_num = 255

[matrix]
row_pins = [
    "P0_06", # D1
    "P0_08", # D0
    "P0_17", # D2
    "P0_20", # D3
]
col_pins = [
    "P0_02", # D19
    "P1_15", # D18
    "P1_13", # D15
    "P1_11", # D14
    "P0_10", # D16
    "P1_04", # D8
    "P0_11", # D7
    "P1_00", # D6
    "P0_24", # D5
    "P0_22", # D4
]
bootmagic = [3, 9]

[host]
unlock_keys = [[3, 9], [3, 0]]

[layout]
rows = 4
cols = 10
map = """
    (3, 9)      (0, 9)      (0, 8)      (0, 7)      [2]                     (0, 2)      (0, 1)      (0, 0)      (3, 0)
[0.5]   (1, 9)      (1, 8)      (1, 7)      (0, 6)  [1]             (0, 3)      (1, 2)      (1, 1)      (1, 0)
    (2, 9)      (2, 8)      (2, 7)      (1, 6)      (0, 5)      (0, 4)      (1, 3)      (2, 2)      (2, 1)      (2, 0)
[1.5]               (3, 8)      (2, 6)      (1, 5)  [1]             (1, 4)      (2, 3)      (3, 1)
[2]                         (3, 6)      (3, 5)      (2, 5)      (2, 4)      (3, 4)      (3, 3)
[3.5]                                       (3, 7)  [1]             (3, 2)
"""

[ble]
enabled = true
# vddh has an internal voltage divider
# battery_adc_pin = "vddh"
# Or
# battery_adc_pin = "P0_04"
# adc_divider_measured = 2000
# adc_divider_total = 2806

# charge_state.pin = "P0_25"
# charge_state.low_active = false
# charge_led.pin = "P0_29"
# charge_led.low_active = false

# [display]
# driver = "ssd1306"
# size = "128x64"
# rotation = 180
# renderer = "OledRenderer"

[keymap]
layers = 4

[[keymap.layer]]
name = "Colemak"
keys = """
    B           @fQuot      W           F                                   U           Y           @fUnds      J
        @A_LGui     @R_LAlt     @S_LCtrl    P                       L           @E_RCtrl    @I_LAlt     @O_RGui
    @X_Undo     @V_Cut      @C_Copy     @T_LShift   @G_RAlt     @M_RAlt     @N_RShift   K           Comma       Dot
                    @Esc_LC     @D_Pste     @Q_Redo                 Z           H           Del
                            @Ent_LShift @Spc_F22 Tab            F24         Bspc        OSM(LShift)
                                            @tdNum                  @tdNav
"""

[[keymap.layer]]
name = "Numeric"
keys = """
    Eql         @fLT        LBrc        @fCbr                               @fExcl      @fAmp       Mins        @fGT
        7           5           3           @fPrn                   @fQues      2           4           6
    Grv         @fHash      @fAst       1           @Bsls_RAlt  Slsh        0           @fPlus      ____        ____
                    ____        9           @fPct                       @fDlr       8           ____
                            ____        ____        ____        ____        ____        ____
                                            ____                    ____
"""

[[keymap.layer]]
name = "Navigation"
keys = """
    PScr        Caps        @CapsWord   Home                                F4          F7          F10         App
        Left        Down        Up          End                     F1          @F5_RCtrl   @F8_LAlt    @F11_RGui
    @Undo_LGui  @Cut_LAlt   @Copy_LCtrl Right       TO(Game)    @PgUp_RAlt  @F2_RShift  F6          F9          F12
                    ____       @Pste_LShift @Redo_RAlt                  PgDn        F3          ____
                            ____        ____        ____        ____        ____        ____
                                            ____                    ____
"""

[[keymap.layer]]
name = "Game"
keys = """
    E           1           2           3                                   F16         F19        F22          Bootloader
        A           S           W           4                       F13         F17         F20         F23
    6           7           8           D           5           @btNxt      F14         F18         F21         F24
                    ____        9           R                       @btClr      F15         ____
                            LShift      Spc         Tab         ____        TO(0)       ____
                                            LCtrl                   ____
"""

[aliases]
CapsWord = "CapsWordToggle"
Compose = "F24"
btNxt = "User3"
btClr = "User5"

